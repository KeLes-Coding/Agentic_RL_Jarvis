data:
  train_batch_size: 16
  val_batch_size: 4
  max_prompt_length: 2048
  max_response_length: 512
  # 请确保这里使用的环境变量 $ALFWORLD_DATA 已在系统中正确设置，或者写绝对路径
  train_files: ["/home/zzh/.cache/alfworld/json_2.1.1/train"] 
  val_files: ["/home/zzh/.cache/alfworld/json_2.1.1/train"]

algorithm:
  adv_estimator: ccapo
  gamma: 1.0
  lam: 1.0
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  
  # CCAPO 专属配置
  ccapo:
    stdb_save_path: "stdb/alfworld_stdb.json"
    stdb_top_k: 1
  
  # GiGPO/GRPO 兼容占位符 (防止底层逻辑报错)
  gigpo:
    step_advantage_w: 1.0
    mode: "mean_std_norm"

# --- 🔥 [关键修复 1] 补全 ray_init ---
ray_init:
  num_cpus: 0  # 0 表示自动检测

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: "Qwen/Qwen2.5-7B-Instruct"
    external_lib: "vllm"
    override_config: {}
    enable_gradient_checkpointing: True
    use_remove_padding: True
  
  actor:
    strategy: "fsdp"
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz: False
    ppo_epochs: 1
    shuffle: True
    clip_ratio: 0.2
    entropy_coeff: 0.001
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.1
      min_lr_ratio: 0.1
      weight_decay: 0.01
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
  
  ref:
    fsdp_config:
      param_offload: True
      grad_offload: True
      optimizer_offload: True
    log_prob_micro_batch_size_per_gpu: 4

  rollout:
    name: "vllm"
    temperature: 0.7
    top_k: -1
    top_p: 1.0
    n: 4
    log_prob_micro_batch_size_per_gpu: 8
    
    multi_turn:
      enable: True 
    # 补充验证参数
    val_kwargs:
        do_sample: True
        n: 1 

env:
  env_name: "alfworld"
  rollout:
    n: 4
  
  jarvis:
    jarvis_config_path: "agent_system/environments/env_package/alfworld/configs/config_tw.yaml"
    max_steps_per_episode: 15
    log_dir: "logger/trajectory_logs"

# --- 🔥 [关键修复 2] 补全 reward_model ---
reward_model:
  enable: False
  reward_manager: episode
  strategy: "fsdp"
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}
    use_remove_padding: True
    fsdp_config:
      param_offload: True
      grad_offload: True
      optimizer_offload: True
  micro_batch_size_per_gpu: 8

# --- 🔥 [关键修复 3] 补全 critic ---
# 即使不使用 Critic，初始化检查也需要这些配置存在
critic:
  strategy: "fsdp"
  ppo_mini_batch_size: 8
  ppo_micro_batch_size_per_gpu: 4
  use_dynamic_bsz: False
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.1
    min_lr_ratio: 0.1
    weight_decay: 0.01
  model:
    path: ${actor_rollout_ref.model.path}
    enable_gradient_checkpointing: True
    use_remove_padding: True
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False

trainer:
  nnodes: 1
  n_gpus_per_node: 1
  total_epochs: 2
  total_training_steps: 100
  project_name: "Verl-CCAPO-ALFWorld"
  experiment_name: "debug_run_001"
  logger: ["console"]
  test_freq: 5
  save_freq: 10
  critic_warmup: 0
  default_local_dir: "checkpoints"
  default_hdfs_dir: null
  resume_mode: "disable"
  del_local_ckpt_after_load: False
  remove_previous_ckpt_in_save: False
  balance_batch: False